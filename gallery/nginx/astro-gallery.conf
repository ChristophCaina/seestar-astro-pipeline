# /etc/nginx/sites-available/astro-gallery  →  ln -s ../sites-available/astro-gallery /etc/nginx/sites-enabled/
# Statische Astro-Galerie, nur im Heimnetz (bzw. per VPN) erreichbar.
server {
    listen 80;
    listen [::]:80;
    server_name astro.lan;                 # an den eigenen lokalen Namen anpassen

    root /srv/astro-gallery;               # Bind-Mount von /data/astro/web (read-only)
    index index.html;

    # Nur lokale Netze zulassen (an eigenes Netz / VPN-Bereich anpassen)
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;                   # Tailscale
    deny all;

    location = /catalog.json {
        add_header Cache-Control "no-cache";
    }
    location /img/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types application/json application/javascript text/css;
}
