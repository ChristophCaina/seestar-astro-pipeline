# /etc/nginx/sites-available/astro-gallery  →  ln -s ../sites-available/astro-gallery /etc/nginx/sites-enabled/
# Statische Astro-Galerie: Heimnetz/Tailscale ohne Passwort, von aussen mit (Basic Auth).
# Bilder unter /img/ ohne Passwort – fuer Vorschau in HA-Dashboard und Push-Nachrichten.
# HTTPS: danach "certbot --nginx -d astrogal.caina.family" (ergaenzt 443 + Umleitung).
server {
    listen 80;
    listen [::]:80;
    server_name astrogal.caina.family;

    root /srv/astro-gallery;               # Bind-Mount von /data/astro/web (read-only)
    index index.html;

    # Let's Encrypt (HTTP-Challenge) muss immer durchkommen
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        auth_basic off;
    }

    # Heimnetz/Tailscale ohne Passwort, sonst Basic Auth (htpasswd -c /etc/nginx/.htpasswd-astro <name>)
    # Hinweis: Aufrufe der eigenen Domain aus dem Heimnetz kommen ueber NAT-Loopback der Fritzbox
    # mit der oeffentlichen IP an – dann greift die Anmeldung.
    satisfy any;
    allow 192.168.52.0/24;
    allow 100.64.0.0/10;                   # Tailscale
    deny all;
    auth_basic "Sternwarte";
    auth_basic_user_file /etc/nginx/.htpasswd-astro;

    location = /catalog.json {
        add_header Cache-Control "no-cache";
    }
    location /img/ {
        auth_basic off;
        allow all;
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types application/json application/javascript text/css;
}
