name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install pillow shellcheck-py numpy aiohttp
          sudo apt-get update -qq && sudo apt-get install -y -qq indi-bin   # INDI-Simulatoren fuer tests/test_pi.py

      - name: shellcheck
        run: shellcheck -S warning siril/*.sh scripts/*.sh

      - name: JavaScript-Syntax
        run: node --check gallery/site/app.js && node --check pi/web/app.js && node --check pi/web/sw.js

      - name: Tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt || {
            # Fehler zusaetzlich als Annotationen, damit sie ohne Log-Download sichtbar sind
            grep -E "^(FAIL|ERROR):|Error:|AssertionError" test-output.txt | head -20 | sed 's/^/::error::/'
            exit 1; }

      - name: Galerie aus Beispieldaten bauen
        run: python gallery/build/gallery_build.py --stacks gallery/sample-data/stacks --out _site

      - uses: actions/upload-artifact@v4
        with:
          name: galerie-beispiel
          path: _site
          retention-days: 7
