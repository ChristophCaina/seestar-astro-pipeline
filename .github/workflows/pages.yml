# Demo-Galerie mit Beispieldaten auf GitHub Pages.
# Aktivieren: Settings → Pages → Source "GitHub Actions" und
# Settings → Secrets and variables → Actions → Variables: ENABLE_PAGES = true
name: Galerie-Demo (Pages)

on:
  push:
    branches: [main]
    paths: ["gallery/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python gallery/build/gallery_build.py --stacks gallery/sample-data/stacks --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
