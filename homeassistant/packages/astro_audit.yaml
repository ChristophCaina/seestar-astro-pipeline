# =============================================================================
# Astro-Audit – Package fuer Home Assistant
#
# Ablage: /config/packages/astro_audit.yaml
#   configuration.yaml:  homeassistant:
#                          packages: !include_dir_named packages
#
# Enthaelt:
#   * Helfer: Empfehlung (an/aus), Stufe, Modus, Kurztext, Beobachtungsfenster
#   * Script astro_audit: KI-Bewertung (ai_task) -> Helfer + Benachrichtigung
#   * Script astro_session_starten: Start je Geraet, NUR per Knopf im Dashboard
#   * Automationen: Audit am Abend,
#     Steuerung sperren, Tauheizung (automatisch), Schutz bei Regen/Wind/Tau
#     (automatisch parken, abschaltbar) – gestartet wird nie automatisch (Zeit/Bedingung)
#
# VOR DEM EINSATZ ANPASSEN:
#   Abschnitt KONFIGURATION (script astro_benachrichtigen, oben unter script:):
#     Teleskope (Entity-Praefix, Weitwinkel ja/nein) und die Handys fuer Meldungen
#   weather.renningen_2, sensor.astroweather_backyard_* -> wie in deinem Script
#   sensor.gw2000a_outdoor_temperature / _rain_rate / _wind_gust -> Namen deiner Ecowitt-Entities pruefen
#   sensor.sternwarte_*  -> spaeterer Sensor am Teleskop (darf fehlen)
# =============================================================================

input_boolean:
  astro_nacht_lohnt:
    name: Astro – Nacht lohnt sich
    icon: mdi:telescope
  astro_schutz_parken:
    name: Astro – Bei Regen/Wind/Tau parken
    icon: mdi:shield-sun

input_select:
  astro_stufe:
    name: Astro – Stufe
    icon: mdi:weather-night
    options: [ideal, gut, bedingt, eingeschraenkt, abbruch]
  astro_stufe_milchstrasse:
    name: Astro – Stufe Milchstraße
    icon: mdi:star-shooting
    options: [ideal, gut, bedingt, eingeschraenkt, abbruch]
  astro_modus:
    name: Astro – Modus
    icon: mdi:star-four-points
    options: [deepsky, weitfeld, planetar, keiner]

input_text:
  astro_empfehlung:
    name: Astro – Empfehlung
    max: 255

input_datetime:
  astro_fenster_start:
    name: Astro – Fenster Beginn
    has_date: true
    has_time: true
  astro_fenster_ende:
    name: Astro – Fenster Ende
    has_date: true
    has_time: true
  astro_mw_start:
    name: Astro – Milchstraße Beginn
    has_date: true
    has_time: true
  astro_mw_ende:
    name: Astro – Milchstraße Ende
    has_date: true
    has_time: true

template:
  - sensor:
      # Taupunktabstand (Temperatur - Taupunkt) mit Prioritaetskette:
      #   1. Sensor am Teleskop/Sternwarte (spaeter, z. B. ESPHome mit SHT45)
      #   2. Ecowitt GW2000A im Garten
      #   3. Wetter-Entity + AstroWeather (Modellwerte) als Rueckfallebene
      - name: Astro – Taupunktabstand
        unique_id: astro_taupunktabstand
        unit_of_measurement: "K"
        device_class: temperature
        state_class: measurement
        icon: mdi:water-thermometer
        state: >-
          {% set ns = namespace(t=none, d=none) %}
          {% set quellen = [
               ['sensor.sternwarte_temperatur', 'sensor.sternwarte_taupunkt'],
               ['sensor.gw2000a_outdoor_temperature', 'sensor.gw2000a_dewpoint'] ] %}
          {% for t_id, d_id in quellen if ns.t is none %}
            {% set t = states(t_id) | float(none) %}
            {% set d = states(d_id) | float(none) %}
            {% if t is not none and d is not none %}{% set ns.t, ns.d = t, d %}{% endif %}
          {% endfor %}
          {% if ns.t is none %}
            {% set ns.t = state_attr('weather.renningen_2', 'temperature') | float(none) %}
            {% set ns.d = states('sensor.astroweather_backyard_2m_dewpoint') | float(none) %}
          {% endif %}
          {{ (ns.t - ns.d) | round(1) if ns.t is not none and ns.d is not none else none }}
        attributes:
          quelle: >-
            {% if states('sensor.sternwarte_temperatur') | is_number and states('sensor.sternwarte_taupunkt') | is_number %}Sternwarte
            {% elif states('sensor.gw2000a_outdoor_temperature') | is_number and states('sensor.gw2000a_dewpoint') | is_number %}Ecowitt Garten
            {% else %}Wettermodell (AstroWeather){% endif %}

script:
  # ===========================================================================
  # KONFIGURATION – Teleskope und Empfaenger. Die Listen gelten fuer alle
  # Automationen dieses Packages (YAML-Anker *astro_teleskope) und – ueber dieses
  # Script – auch fuer die Meldungen aus astro_stacks.yaml.
  #   id         kurz, OHNE Unterstrich (steht in den Push-Aktionen)
  #   prefix     Entity-Praefix des Geraets in ha-seestar (switch.<prefix>_dew_heater …)
  #   weitwinkel true = Milchstrassen-Modus moeglich (S30 Pro), nur zur Info
  # Geraete, die (noch) nicht existieren oder nicht verbunden sind, werden uebersprungen.
  # ===========================================================================
  astro_benachrichtigen:
    alias: Astro – Benachrichtigen
    description: Schickt eine Nachricht an alle Handys aus der Konfiguration.
    mode: parallel
    max: 20
    icon: mdi:message-badge
    fields:
      title:
        description: Überschrift
        selector:
          text:
      message:
        description: Text
        selector:
          text:
            multiline: true
      data:
        description: Zusatzdaten für die Companion-App (tag, actions, image …)
        selector:
          object:
    variables:
      teleskope: &astro_teleskope
        - {id: s50, name: Seestar S50, prefix: seestar_s50, weitwinkel: false}
        - {id: s30, name: Seestar S30 Pro, prefix: seestar_s30, weitwinkel: true}
      empfaenger: &astro_empfaenger
        - notify.mobile_app_handy          # dein Handy
        - notify.mobile_app_handy_2        # weiteres Handy (z. B. deiner Frau) – oder Zeile loeschen
    sequence:
      - repeat:
          for_each: *astro_empfaenger
          sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ title | default('') }}"
                message: "{{ message | default('') }}"
                data: "{{ data | default({}) }}"

  astro_audit:
    alias: 'Astro-Audit: Sternwarten-Modus'
    description: >-
      Führt ein KI-gestütztes Audit durch, das zwischen idealen Deepsky-Bedingungen
      und möglichen Lunar/Planetary-Bedingungen unterscheidet, inklusive
      detaillierter Wetter- und Sichtbarkeitsanalyse.
    sequence:
      - variables:
          moon_ok: >-
            {{
            is_state('binary_sensor.astroweather_backyard_moon_always_down_during_darkness',
            'on') }}
          deepsky_score_today: >-
            {{ states('sensor.astroweather_backyard_deepsky_forecast_today') |
            int(0) }}
          deepsky_score_tomorrow: >-
            {{ states('sensor.astroweather_backyard_deepsky_forecast_tomorrow') |
            int(0) }}
          deepsky_desc_today: >-
            {{
            states('sensor.astroweather_backyard_deepsky_forecast_today_description')
            }}
          condition_pct: '{{ states(''sensor.astroweather_backyard_condition'') | int(0) }}'
          wind_speed: '{{ states(''sensor.astroweather_backyard_10m_wind_speed'') | float(99) }}'
          calm: '{{ states(''sensor.astroweather_backyard_calm_percentage'') | float(0) }}'
          moon_altitude: '{{ states(''sensor.astroweather_backyard_moon_altitude'') | float(0) }}'
          moon_phase: '{{ states(''sensor.astroweather_backyard_moon_phase'') }}'
          moon_next_setting: '{{ states(''sensor.astroweather_backyard_moon_next_setting'') }}'
          seeing: '{{ states(''sensor.astroweather_backyard_seeing'') | float(5) }}'
          cloud_cover: '{{ states(''sensor.astroweather_backyard_cloud_cover'') | float(100) }}'
          cloudless_pct: '{{ states(''sensor.astroweather_backyard_cloudless'') | float(0) }}'
          transparency: '{{ states(''sensor.astroweather_backyard_transparency'') | int(0) }}'
          lifted_index_plain: '{{ states(''sensor.astroweather_backyard_lifted_index_plain'') }}'
          current_temp: '{{ state_attr(''weather.renningen_2'', ''temperature'') | float(-99) }}'
          rel_humidity: >-
            {{ states('sensor.astroweather_backyard_2m_relative_humidity') |
            float(0) }}
          dewpoint: '{{ states(''sensor.astroweather_backyard_2m_dewpoint'') | float(0) }}'
          fog_prob: '{{ states(''sensor.astroweather_backyard_fog_area'') | float(0) }}'
          fog_prob_ground: '{{ states(''sensor.astroweather_backyard_fog_2m_area'') | float(0) }}'
          astro_dark_start: >-
            {{ states('sensor.astroweather_backyard_sun_next_setting_astronomical')
            }}
          astro_dark_end: >-
            {{ states('sensor.astroweather_backyard_sun_next_rising_astronomical')
            }}
          darkness_quality: >-
            {% set sun_elev = state_attr('sun.sun', 'elevation') | float(0) %} {{
            'Astronomische Dunkelheit (optimal)' if sun_elev <= -18 else 'Nautische
            Dämmerung (akzeptabel)' if sun_elev <= -12 else 'Bürgerliche Dämmerung
            (eingeschränkt)' if sun_elev <= -6 else 'Helle Nacht / Mitternachtssonne
            (stark eingeschränkt)' }}
          dew_warning: >-
            {{ 'JA – Taugefahr (Temp: ' ~ current_temp ~ '°C / Taupunkt: ' ~
            dewpoint ~ '°C)'
               if (current_temp - dewpoint) <= 3 else 'Nein' }}
      - data:
          type: hourly
        target:
          entity_id: weather.renningen_2
        response_variable: hourly_forecast
        action: weather.get_forecasts
      - variables:
          forecast_data: '{{ hourly_forecast[''weather.renningen_2''].forecast }}'
          min_night_temp: >-
            {% set temps = forecast_data[:8] | map(attribute='temperature') | list
            %} {{ temps | min | float(-99) }}
          bad_conditions_later: >-
            {% set bad_list = ['rainy', 'pouring', 'snowy', 'snowy-rainy',
            'lightning', 'lightning-rainy'] %} {% set ns = namespace(found=false) %}
            {% for entry in forecast_data[:8] %}
              {% if not ns.found %}
                {% if entry.condition in bad_list or (entry.get('cloud_coverage', 0) | int) > 75 %}
                  {% set ns.found = true %}
                {% endif %}
              {% endif %}
            {% endfor %} {{ 'Ja' if ns.found else 'Nein' }}
          first_clearing_hour: >-
            {% set ns = namespace(found=false, hour='Nein, keine Aufheiterung
            erwartet') %} {% for entry in forecast_data[:8] %}
              {% if not ns.found and loop.index > 1 %}
                {% if (entry.get('cloud_coverage', 100) | int) < 30 %}
                  {% set ns.found = true %}
                  {% set ns.hour = 'Ja, ab ca. ' ~ ((now().hour + loop.index - 1) % 24) ~ ' Uhr' %}
                {% endif %}
              {% endif %}
            {% endfor %} {{ ns.hour }}
      # Milchstrasse: hoechste Hoehe je Region im Dunkelfenster (fuer den Modus "weitfeld")
      - variables:
          milchstrasse: >-
            {% set lat = state_attr('zone.home', 'latitude') | float(48.7) %}
            {% set lon = state_attr('zone.home', 'longitude') | float(8.9) %}
            {% set ds = as_datetime(astro_dark_start, none) %}
            {% set de = as_datetime(astro_dark_end, none) %}
            {% if ds is none or de is none or de <= ds %}keine astronomische Dunkelheit{% else %}
            {% set regions = [['Zentrum (Schütze)', 266.42, -29.0], ['Schwan', 305.0, 40.0],
                              ['Kassiopeia–Perseus', 30.0, 58.0], ['Fuhrmann–Orion', 90.0, 25.0]] %}
            {% set ns = namespace(out=[]) %}
            {% for r in regions %}
              {% set best = namespace(alt=-90, t=0) %}
              {% set t0 = as_timestamp(ds) %}
              {% for i in range((((as_timestamp(de) - t0) / 1800) | int) + 1) %}
                {% set t = t0 + i * 1800 %}
                {% set gmst = (280.46061837 + 360.98564736629 * (t / 86400 + 2440587.5 - 2451545.0)) % 360 %}
                {% set ha = ((gmst + lon - r[1]) % 360) * pi / 180 %}
                {% set alt = asin(sin(lat * pi / 180) * sin(r[2] * pi / 180)
                                  + cos(lat * pi / 180) * cos(r[2] * pi / 180) * cos(ha)) * 180 / pi %}
                {% if alt > best.alt %}{% set best.alt = alt %}{% set best.t = t %}{% endif %}
              {% endfor %}
              {% set ns.out = ns.out + [r[0] ~ ' max ' ~ (best.alt | round(0) | int) ~ '° (' ~ (best.t | timestamp_custom('%H:%M')) ~ ')'] %}
            {% endfor %}{{ ns.out | join(', ') }}{% endif %}
      - action: ai_task.generate_data
        response_variable: astro_report
        data:
          task_name: Astro-Nacht-Audit
          instructions: >
            Du bist ein erfahrener Astrofotograf und bewertest die heutige Nacht für
            den Standort Renningen (Baden-Württemberg, Deutschland).

            == BEWERTUNGS-LOGIK ==

            Bewerte ausschließlich anhand dieser PRIMÄREN Parameter (atmosphärische
            Qualität):
              - Deepsky Score (Hauptindikator)
              - Seeing (1=perfekt, 5=schlecht) — niedriger = besser
              - Transparenz (%)
              - Wolkenbedeckung (%)
              - Windgeschwindigkeit (km/h)

            Die astronomische Dunkelheit (darkness_quality) ist ein SEKUNDÄRER,
            informativer Parameter. Sie kann eine Session einschränken oder
            verbessern, ist aber KEIN Ausschlusskriterium allein. Weise darauf hin,
            erkläre den Einfluss, aber lass sie nicht allein über die Empfehlung
            entscheiden.

            MODUS WEITFELD (Milchstraße/Sternbilder mit DSLR und Objektiv): sinnvoll,
            wenn der Mond nicht stört (Mond stört: Nein oder Mond unter dem Horizont),
            Transparenz >= 60 %, Wolken < 20 % und eine Milchstraßen-Region (siehe
            MESSDATEN) mindestens 35° hoch steht. Seeing ist für Weitwinkel unwichtig.
            Ist Deep-Sky ebenfalls gut, wähle den Modus mit dem größeren Vorteil und
            nenne den anderen als Alternative. Im Bericht bei weitfeld die beste Region
            und Uhrzeit nennen.

            ZWEI BEWERTUNGEN: In derselben Nacht können zwei Geräte parallel arbeiten
            (Deep-Sky mit dem Tele, Milchstraße mit einer Weitwinkelkamera). Gib daher
            stufe (Deep-Sky/Planeten) UND stufe_milchstrasse getrennt an.
            stufe_milchstrasse nach denselben Stufen, aber mit den Kriterien von MODUS
            WEITFELD: Seeing egal; Mond, Transparenz, Wolken und die Höhe der
            Milchstraßen-Regionen zählen. Steht keine Region mindestens 30° hoch oder
            stört der Mond die ganze Nacht → abbruch. Nenne im Bericht beide Stufen.

            EMPFEHLUNGS-STUFEN:
              🌌 IDEAL        → Deepsky >= 70, Seeing <= 3, Wind < 10, Wolken < 20%
              🌠 GUT          → Deepsky >= 50, Seeing <= 4, Wind < 15, Wolken < 40%
              🌕 BEDINGT      → Seeing <= 3, Transparenz >= 50 (Planeten/Mond)
              ⚠️ EINGESCHRÄNKT → Einzelne Parameter grenzwertig, Session aber möglich
              ❌ ABBRUCH      → Wolken > 80% ODER Wind > 25 km/h ODER Seeing = 5

            Wenn darkness_quality NICHT "Astronomische Dunkelheit (optimal)" ist,
            passe die Stufe um maximal eine Kategorie nach unten an (nicht mehr).
            Erkläre den Einfluss im Bericht und weise auf trotzdem beobachtbare
            Objekte hin (Planeten, Mond, Doppelsterne, helle Nebel).

            == AUSGABE-FORMAT ==

            Verwende ausschließlich einfachen Text und HTML. KEIN Markdown. KEINE
            Pipe-Tabellen. KEINE Sterne (*). KEINE eckigen Klammern.

            Strukturiere die Antwort GENAU so:

            Eine Zeile: Emoji + kurze Empfehlung.

            Dann ein Absatz Zusammenfassung (2-3 Sätze).

            Dann eine HTML-Tabelle mit den Messwerten: <b>📊 Messwerte</b> <table>
              <tr><th>Parameter</th><th>Wert</th><th>Bewertung</th></tr>
              <tr><td>Deepsky Score</td><td>WERT %</td><td>BEWERTUNG</td></tr>
              <tr><td>Seeing</td><td>WERT</td><td>BEWERTUNG</td></tr>
              <tr><td>Transparenz</td><td>WERT %</td><td>BEWERTUNG</td></tr>
              <tr><td>Wolkenbedeckung</td><td>WERT %</td><td>BEWERTUNG</td></tr>
              <tr><td>Wind</td><td>WERT km/h</td><td>BEWERTUNG</td></tr>
              <tr><td>Mond</td><td>Phase / Höhe</td><td>stört / stört nicht</td></tr>
              <tr><td>Dunkelheit</td><td colspan="2">WERT</td></tr>
              <tr><td>Temperatur</td><td>WERT °C</td><td>Taupunkt: WERT °C</td></tr>
            </table>

            Dann ein Abschnitt Hinweise als HTML-Liste: <b>📝 Hinweise</b> <ul>
              <li>Kleidung: Hinweis nur bei Temperatur <= 5°C</li>
              <li>Tauwarnung: nur wenn dew_warning "JA" enthält</li>
              <li>Nebel: nur wenn fog_prob_ground > 20%</li>
              <li>Wetterprognose mit bad_conditions_later und first_clearing_hour</li>
              <li>Ausblick morgen mit Deepsky Score</li>
            </ul>

            MESSDATEN: - Deepsky Score Heute: {{ deepsky_score_today }} % ({{
            deepsky_desc_today }}) - Deepsky Score Morgen: {{ deepsky_score_tomorrow
            }} % - Gesamtbedingung: {{ condition_pct }} % - Wind: {{ wind_speed |
            round(0) }} km/h | Windruhe: {{ calm }} % - Seeing: {{ seeing }}
            (1=perfekt, 5=schlecht) - Transparenz: {{ transparency }} % - Wolken: {{
            cloud_cover }} % (wolkenlos: {{ cloudless_pct }} %) - Lifted Index: {{
            lifted_index_plain }} - Mond stört: {{ 'Nein' if moon_ok else 'Ja' }} |
            Phase: {{ moon_phase }} | Höhe: {{ moon_altitude }}° - Mond Untergang:
            {{ moon_next_setting }} - Dunkelheit: {{ darkness_quality }} -
            Astro-Dunkelheit: {{ astro_dark_start }} bis {{ astro_dark_end }} -
            Milchstraße: {{ milchstrasse }} -
            Temperatur: {{ current_temp }} °C | Taupunkt: {{ dewpoint }} °C -
            Luftfeuchte: {{ rel_humidity }} % - Taugefahr: {{ dew_warning }} - Nebel
            (Boden): {{ fog_prob_ground }} % | Gebiet: {{ fog_prob }} % -
            Wetterverschlechterung: {{ bad_conditions_later }} - Aufheiterung: {{
            first_clearing_hour }} - Min. Nachttemperatur: {{ min_night_temp }} °C
          structure:
            stufe:
              description: >-
                Empfehlungsstufe gemäß EMPFEHLUNGS-STUFEN, nach einer eventuellen
                Abstufung wegen der Dunkelheit.
              required: true
              selector:
                select:
                  options:
                    - ideal
                    - gut
                    - bedingt
                    - eingeschraenkt
                    - abbruch
            stufe_milchstrasse:
              description: >-
                Stufe für Milchstraße/Weitwinkel gemäß ZWEI BEWERTUNGEN.
              required: true
              selector:
                select:
                  options:
                    - ideal
                    - gut
                    - bedingt
                    - eingeschraenkt
                    - abbruch
            modus:
              description: >-
                Wofür sich die Nacht eignet: deepsky (Nebel, Galaxien), weitfeld
                (Milchstraße, Sternbilder mit Objektiv), planetar (Mond, Planeten,
                Doppelsterne) oder keiner.
              required: true
              selector:
                select:
                  options:
                    - deepsky
                    - weitfeld
                    - planetar
                    - keiner
            empfehlung_kurz:
              description: >-
                Nur Emoji + max. 4 Wörter. Beispiel: "🌌 Ideal – Deepsky". Kein
                Markdown, kein Punkt am Ende.
              required: true
              selector:
                text: null
            begruendung_detailliert:
              description: >-
                Vollständiger Bericht in einfachem Text und HTML (table, ul, li, b).
                Absolut kein Markdown, keine Pipe-Symbole, keine Sterne.
              required: true
              selector:
                text: null
      # ---- Ergebnis in Helfer schreiben (Grundlage fuer alle Folge-Automationen) ----
      - variables:
          stufe: "{{ astro_report.data.stufe | default('abbruch') }}"
          stufe_mw: "{{ astro_report.data.stufe_milchstrasse | default('abbruch') }}"
          modus: "{{ astro_report.data.modus | default('keiner') }}"
          lohnt: "{{ stufe in ['ideal', 'gut', 'bedingt'] or stufe_mw in ['ideal', 'gut', 'bedingt'] }}"
          # Milchstrassen-Fenster: dunkel, Mond untergegangen (falls er stoert) und
          # mindestens eine Milchstrassen-Region >= 30° hoch; 15-min-Raster
          mw_fenster: >-
            {% set lat = state_attr('zone.home', 'latitude') | float(48.7) %}
            {% set lon = state_attr('zone.home', 'longitude') | float(8.9) %}
            {% set ds = as_datetime(astro_dark_start, none) %}
            {% set de = as_datetime(astro_dark_end, none) %}
            {% set ms = as_datetime(moon_next_setting, none) %}
            {% if ds is none or de is none or de <= ds %}{{ {} }}{% else %}
            {% set t0 = as_timestamp(ms) if (not moon_ok and ms is not none and ds < ms < de) else as_timestamp(ds) %}
            {% set regions = [[266.42, -29.0], [305.0, 40.0], [30.0, 58.0], [90.0, 25.0]] %}
            {% set ns = namespace(a=none, b=none) %}
            {% for i in range((((as_timestamp(de) - t0) / 900) | int) + 1) %}
              {% set t = t0 + i * 900 %}
              {% set gmst = (280.46061837 + 360.98564736629 * (t / 86400 + 2440587.5 - 2451545.0)) % 360 %}
              {% set hoch = namespace(ok=false) %}
              {% for r in regions %}
                {% set ha = ((gmst + lon - r[0]) % 360) * pi / 180 %}
                {% set alt = asin(sin(lat * pi / 180) * sin(r[1] * pi / 180)
                                  + cos(lat * pi / 180) * cos(r[1] * pi / 180) * cos(ha)) * 180 / pi %}
                {% if alt >= 30 %}{% set hoch.ok = true %}{% endif %}
              {% endfor %}
              {% if hoch.ok %}{% if ns.a is none %}{% set ns.a = t %}{% endif %}{% set ns.b = t %}{% endif %}
            {% endfor %}
            {{ {'start': ns.a, 'ende': ns.b} if ns.a is not none and ns.b > ns.a else {} }}{% endif %}
          # Beobachtungsfenster: astronomische Dunkelheit; fuer Deep-Sky erst nach
          # Monduntergang, wenn der Mond sonst stoert.
          fenster_start: >-
            {% set ds = as_datetime(astro_dark_start, none) %}
            {% set de = as_datetime(astro_dark_end, none) %}
            {% set ms = as_datetime(moon_next_setting, none) %}
            {% if ds is none %}{{ none }}
            {% elif modus in ['deepsky', 'weitfeld'] and not moon_ok and ms is not none and de is not none and ds < ms < de %}{{ ms.isoformat() }}
            {% else %}{{ ds.isoformat() }}{% endif %}
          fenster_ende: "{{ (as_datetime(astro_dark_end, none) or now()).isoformat() }}"
      - action: "input_boolean.turn_{{ 'on' if lohnt else 'off' }}"
        target:
          entity_id: input_boolean.astro_nacht_lohnt
      - action: input_select.select_option
        target:
          entity_id: input_select.astro_stufe
        data:
          option: "{{ stufe }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.astro_stufe_milchstrasse
        data:
          option: "{{ stufe_mw }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.astro_modus
        data:
          option: "{{ modus }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.astro_empfehlung
        data:
          value: "{{ astro_report.data.empfehlung_kurz[:250] }}"
      - if: "{{ fenster_start not in [none, 'None', ''] }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.astro_fenster_start
            data:
              timestamp: "{{ as_timestamp(fenster_start) }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.astro_fenster_ende
            data:
              timestamp: "{{ as_timestamp(fenster_ende) }}"
      - if: "{{ mw_fenster.start is defined }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.astro_mw_start
            data:
              timestamp: "{{ mw_fenster.start }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.astro_mw_ende
            data:
              timestamp: "{{ mw_fenster.ende }}"
      # ---- Benachrichtigung wie bisher ----
      - action: persistent_notification.create
        data:
          title: '🔭 ASTRO-AUDIT: {{ astro_report.data.empfehlung_kurz }}'
          message: '{{ astro_report.data.begruendung_detailliert }}'

  # Startet eine Session auf EINEM Teleskop. Aufruf nur von Hand (Knopf je Geraet im
  # Dashboard) – keine Automation ruft es auf. Gibt die Steuerung frei, dann der eigene Ablauf.
  astro_session_starten:
    alias: Astro – Session starten
    icon: mdi:play-circle
    mode: parallel
    max: 4
    fields:
      teleskop:
        description: id aus der Konfiguration (z. B. s50)
        required: true
        example: s50
        selector:
          text:
      modus:
        description: deepsky oder weitfeld
        default: deepsky
        selector:
          select:
            options: [deepsky, weitfeld]
    variables:
      teleskope: *astro_teleskope
      t: "{{ (teleskope | selectattr('id', 'eq', teleskop) | list + [{}])[0] }}"
      modus_name: "{{ 'Milchstraße' if modus | default('deepsky') == 'weitfeld' else 'Deep-Sky' }}"
    sequence:
      - condition: template
        value_template: "{{ t.prefix is defined }}"
      - action: switch.turn_on
        target:
          entity_id: "switch.{{ t.prefix }}_controls_enabled"
      # ---- eigener Ablauf je Modus (Platzhalter) ----
      # Beispiel A – Plan im seestar_alp-Scheduler starten (rest_command selbst anlegen,
      #   Endpunkt laut seestar_alp-Doku pruefen, Geraet ueber t.id/t.prefix waehlen):
      # - action: rest_command.seestar_alp_schedule_start
      #   data: {device: "{{ t.id }}", plan: "{{ modus }}"}
      # Beispiel B – Entities des HA-Add-ons: Stacking auf dem aktuellen Ziel (nach GoTo)
      #   oder einen in seestar_alp gespeicherten Plan per Name starten:
      # - action: button.press
      #   target: {entity_id: "button.{{ t.prefix }}_start_stacking"}
      # - action: text.set_value
      #   target: {entity_id: "text.{{ t.prefix }}_run_plan"}
      #   data: {value: "{{ 'milchstrasse' if modus == 'weitfeld' else 'deepsky' }}"}
      - action: logbook.log
        data:
          name: Astro
          message: >-
            Session bestätigt: {{ t.name }} – {{ modus_name }}
            (script.astro_session_starten ist noch ein Platzhalter)

  # Ein Start-Script je Geraet und Modus – fuer die Knoepfe im Dashboard (Kachel + Knopf).
  # Neues Geraet: Block kopieren, teleskop = id aus der KONFIGURATION.
  astro_start_s50:
    alias: Astro – S50 starten (Deep-Sky)
    icon: mdi:play-circle
    mode: single
    sequence:
      - action: script.astro_session_starten
        data: {teleskop: s50, modus: deepsky}
  astro_start_s30_milchstrasse:
    alias: Astro – S30 Pro starten (Milchstraße)
    icon: mdi:star-shooting
    mode: single
    sequence:
      - action: script.astro_session_starten
        data: {teleskop: s30, modus: weitfeld}
  astro_start_s30_deepsky:
    alias: Astro – S30 Pro starten (Deep-Sky)
    icon: mdi:play-circle
    mode: single
    sequence:
      - action: script.astro_session_starten
        data: {teleskop: s30, modus: deepsky}

  # GoTo auf RA/Dec fuer EIN Teleskop – ueber ha-seestar (Goto target/RA/Dec + Goto).
  # Aufruf per Knopf (script.astro_goto_<id> aus astro_goto.yaml). Verweigert Ziele unter 15°.
  astro_goto:
    alias: Astro – GoTo
    icon: mdi:crosshairs-gps
    mode: parallel
    max: 4
    fields:
      teleskop:
        description: id aus der Konfiguration (z. B. s50)
        required: true
        example: s50
        selector:
          text:
      name:
        description: Zielname (nur Beschriftung)
        example: M 31
        selector:
          text:
      ra:
        description: Rektaszension J2000 in Stunden (z. B. 0.7123)
        required: true
        selector:
          text:
      dec:
        description: Deklination J2000 in Grad (z. B. 41.269)
        required: true
        selector:
          text:
    variables:
      teleskope: *astro_teleskope
      t: "{{ (teleskope | selectattr('id', 'eq', teleskop) | list + [{}])[0] }}"
      hoehe: >-
        {% set lat = state_attr('zone.home', 'latitude') | float(48.7) * pi / 180 %}
        {% set lon = state_attr('zone.home', 'longitude') | float(8.9) %}
        {% set d = as_timestamp(now()) / 86400 + 2440587.5 - 2451545.0 %}
        {% set lst = (280.46061837 + 360.98564736629 * d + lon) % 360 %}
        {% set ha = ((lst - (ra | float(0)) * 15) % 360) * pi / 180 %}
        {% set de = (dec | float(0)) * pi / 180 %}
        {{ (asin(sin(lat) * sin(de) + cos(lat) * cos(de) * cos(ha)) * 180 / pi) | round(0) }}
    sequence:
      - if: "{{ t.prefix is not defined }}"
        then:
          - stop: "Unbekanntes Teleskop '{{ teleskop }}' – KONFIGURATION in astro_audit.yaml prüfen"
            error: true
      - if: "{{ hoehe | float < 15 }}"
        then:
          - stop: "{{ name | default('Ziel') }} steht zu tief ({{ hoehe | int }}°) – GoTo abgebrochen"
            error: true
      - action: switch.turn_on
        target:
          entity_id: "switch.{{ t.prefix }}_controls_enabled"
      - action: text.set_value
        target:
          entity_id: "text.{{ t.prefix }}_goto_target"
        data:
          value: "{{ name | default('Ziel') }}"
      - action: text.set_value
        target:
          entity_id: "text.{{ t.prefix }}_goto_ra"
        data:
          value: "{{ ra }}"
      - action: text.set_value
        target:
          entity_id: "text.{{ t.prefix }}_goto_dec"
        data:
          value: "{{ dec }}"
      - action: button.press
        target:
          entity_id: "button.{{ t.prefix }}_goto"
      - action: logbook.log
        data:
          name: Astro
          message: "{{ t.name }}: GoTo {{ name | default('') }} (Höhe {{ hoehe | int }}°)"

  # Stopp / Parken je Teleskop – nur per Knopf im Dashboard (Kachel mit Rueckfrage).
  astro_session_beenden:
    alias: Astro – Session beenden
    icon: mdi:stop-circle
    mode: parallel
    max: 4
    fields:
      teleskop:
        description: id aus der Konfiguration (z. B. s50)
        required: true
        example: s50
        selector:
          text:
      parken:
        description: nach dem Stoppen parken
        default: false
        selector:
          boolean:
    variables:
      teleskope: *astro_teleskope
      t: "{{ (teleskope | selectattr('id', 'eq', teleskop) | list + [{}])[0] }}"
    sequence:
      - condition: template
        value_template: "{{ t.prefix is defined }}"
      - action: switch.turn_on
        target:
          entity_id: "switch.{{ t.prefix }}_controls_enabled"
      # laufendes GoTo und Plan/Session stoppen (ha-seestar: "Stop goto", "Stop")
      - action: button.press
        target:
          entity_id:
            - "button.{{ t.prefix }}_stop_goto"
            - "button.{{ t.prefix }}_stop"
        continue_on_error: true
      - if: "{{ parken | default(false) }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: "switch.{{ t.prefix }}_allow_power_actions"
          - action: button.press
            target:
              entity_id: "button.{{ t.prefix }}_park"
            continue_on_error: true
      - action: logbook.log
        data:
          name: Astro
          message: "{{ t.name }}: {{ 'gestoppt und geparkt' if parken | default(false) else 'gestoppt' }}"
  astro_stopp_s50:
    alias: Astro – S50 stoppen
    icon: mdi:stop-circle
    mode: single
    sequence:
      - action: script.astro_session_beenden
        data: {teleskop: s50, parken: false}
  astro_parken_s50:
    alias: Astro – S50 parken
    icon: mdi:home-import-outline
    mode: single
    sequence:
      - action: script.astro_session_beenden
        data: {teleskop: s50, parken: true}
  astro_stopp_s30:
    alias: Astro – S30 Pro stoppen
    icon: mdi:stop-circle
    mode: single
    sequence:
      - action: script.astro_session_beenden
        data: {teleskop: s30, parken: false}
  astro_parken_s30:
    alias: Astro – S30 Pro parken
    icon: mdi:home-import-outline
    mode: single
    sequence:
      - action: script.astro_session_beenden
        data: {teleskop: s30, parken: true}

automation:
  # Audit jeden Abend kurz nach Sonnenuntergang
  - id: astro_audit_abends
    alias: Astro – Audit am Abend
    mode: single
    triggers:
      - trigger: sun
        event: sunset
        offset: "00:30:00"
    actions:
      - action: script.astro_audit

  # ... und am Ende (oder spaetestens vor der Daemmerung) alle wieder sperren
  - id: astro_steuerung_sperren
    alias: Astro – Steuerung sperren
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.astro_fenster_ende
      - trigger: sun
        event: sunrise
        offset: "-01:00:00"
    variables:
      teleskope: *astro_teleskope
      schalter: >-
        {% set ns = namespace(l=[]) %}
        {% for t in teleskope %}
          {% for s in ['allow_power_actions', 'controls_enabled', 'dew_heater'] %}
            {% set e = 'switch.' ~ t.prefix ~ '_' ~ s %}
            {% if has_value(e) %}{% set ns.l = ns.l + [e] %}{% endif %}
          {% endfor %}
        {% endfor %}{{ ns.l }}
    actions:
      - condition: template
        value_template: "{{ schalter | count > 0 }}"
      - action: switch.turn_off
        target:
          entity_id: "{{ schalter }}"

  # Tauheizung mit Hysterese (an <= 3 K, aus >= 5 K) – fuer jedes freigegebene Teleskop
  - id: astro_tauheizung
    alias: Astro – Tauheizung
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.astro_taupunktabstand
        below: 3
        id: an
      - trigger: numeric_state
        entity_id: sensor.astro_taupunktabstand
        above: 5
        id: aus
    variables:
      teleskope: *astro_teleskope
      heizungen: >-
        {% set ns = namespace(l=[]) %}
        {% for t in teleskope if is_state('switch.' ~ t.prefix ~ '_controls_enabled', 'on') %}
          {% set ns.l = ns.l + ['switch.' ~ t.prefix ~ '_dew_heater'] %}
        {% endfor %}{{ ns.l }}
    actions:
      - condition: template
        value_template: "{{ heizungen | count > 0 }}"
      - action: "switch.turn_{{ 'on' if trigger.id == 'an' else 'off' }}"
        target:
          entity_id: "{{ heizungen }}"

  # Schutz in der Nacht: bei Regen, Sturmboeen oder Tau trotz Heizung AUTOMATISCH parken –
  # alle verbundenen Teleskope. Einzige automatische Aktion neben der Tauheizung (Schalter: input_boolean.astro_schutz_parken).
  - id: astro_regenwarnung
    alias: Astro – Schutz (Regen, Wind, Tau)
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.gw2000a_event_rain
        id: regen
      - trigger: numeric_state
        entity_id: sensor.gw2000a_rain_rate
        above: 0
        id: regen
      - trigger: state
        entity_id: weather.renningen_2
        to: [rainy, pouring, lightning, lightning-rainy, snowy, snowy-rainy, hail]
        id: wetter
      - trigger: numeric_state
        entity_id: sensor.gw2000a_wind_gust          # Ecowitt-Boeen in km/h
        above: 35
        for: "00:02:00"
        id: wind
      - trigger: numeric_state
        entity_id: sensor.astro_taupunktabstand
        below: 1
        for: "00:15:00"                               # Heizung kommt nicht mehr hinterher
        id: tau
    variables:
      teleskope: *astro_teleskope
      # Praefixe der verbundenen Teleskope
      draussen: >-
        {% set ns = namespace(l=[]) %}
        {% for t in teleskope if is_state('binary_sensor.' ~ t.prefix ~ '_connected', 'on') %}
          {% set ns.l = ns.l + [t.prefix] %}
        {% endfor %}{{ ns.l }}
    conditions:
      - condition: template
        value_template: "{{ draussen | count > 0 }}"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      # Event-Regen nur bei Zunahme (Reset auf 0 ignorieren)
      - condition: template
        value_template: >-
          {{ trigger.id != 'regen' or trigger.platform != 'state'
             or (trigger.to_state.state | float(0)) > (trigger.from_state.state | float(0)) }}
    actions:
      - variables:
          grund: >-
            {{ {'regen': 'Ecowitt misst Regen', 'wetter': 'Wetter meldet ' ~ states('weather.renningen_2'),
                'wind': 'Böen ' ~ states('sensor.gw2000a_wind_gust') ~ ' km/h',
                'tau': 'Taupunktabstand ' ~ states('sensor.astro_taupunktabstand') ~ ' K'}[trigger.id] }}
          parken: "{{ is_state('input_boolean.astro_schutz_parken', 'on') }}"
          namen: >-
            {{ teleskope | selectattr('prefix', 'in', draussen) | map(attribute='name') | join(', ') }}
      - if: "{{ parken }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: >-
                {% set ns = namespace(l=[]) %}
                {% for p in draussen %}
                  {% set ns.l = ns.l + ['switch.' ~ p ~ '_controls_enabled', 'switch.' ~ p ~ '_allow_power_actions'] %}
                {% endfor %}{{ ns.l }}
          - action: button.press
            target:
              entity_id: >-
                {% set ns = namespace(l=[]) %}
                {% for p in draussen %}{% set ns.l = ns.l + ['button.' ~ p ~ '_park'] %}{% endfor %}{{ ns.l }}
            continue_on_error: true
      - action: script.astro_benachrichtigen
        data:
          title: "{{ '🛑 Geparkt: ' ~ namen if parken else '⚠️ Noch draußen: ' ~ namen }}"
          message: "{{ grund }}. {{ 'Automatisch geparkt – Geräte reinholen.' if parken else 'Teleskope ggf. reinholen (automatisches Parken ist aus).' }}"
          data:
            priority: high
            tag: astro_schutz
      - delay: "00:10:00"     # nicht im Minutentakt erneut melden
