# Optionaler Abschnitt für das Dashboard „Sternwarte“: Seestar S30 Pro
#
# Erst einfügen, wenn das zweite Seestar in Home Assistant angelegt ist (Präfix prüfen) – sonst meldet z. B. Spook unbekannte Entities.
# Einfügen: Raw-Konfigurationseditor → ans Ende der Liste unter `sections:` anhängen
# (Einrückung so lassen, wie sie hier steht).
      # Zweites Seestar (S30 Pro) – erscheint nur, solange es verbunden ist.
      # seestar_s30 durch das Entity-Präfix ersetzen, das ha-seestar für das Gerät anlegt.
      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.seestar_s30_connected
            state: 'on'
        cards:
          - type: heading
            heading: Seestar S30 Pro
            icon: mdi:telescope
            heading_style: subtitle
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.seestar_s30_storage_used
                color: state
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.seestar_s30_battery
                color: state
          - type: custom:seestar-card
            device: seestar_s30
            # Goto-Knopf der Karte fährt das Ziel aus der Auswahl an (mit 15°-Prüfung)
            actions:
              goto:
                service: script.turn_on
                data:
                  entity_id: script.astro_goto_s30
            grid_options:
              columns: full
          - type: tile
            entity: switch.seestar_s30_controls_enabled
            name: Steuerung freigegeben
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: switch.seestar_s30_dew_heater
            name: Tauheizung
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: input_select.astro_ziel_s30
            name: Ziel
            icon: mdi:target
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: full
          - type: tile
            entity: script.astro_goto_s30
            name: GoTo starten
            icon: mdi:crosshairs-gps
            tap_action:
              action: perform-action
              perform_action: script.astro_goto_s30
            features:
              - type: button
          - type: tile
            entity: script.astro_start_s30_milchstrasse
            name: Milchstraße starten
            icon: mdi:star-shooting
            tap_action:
              action: perform-action
              perform_action: script.astro_start_s30_milchstrasse
              confirmation:
                text: S30 Pro jetzt starten (Milchstraße)?
            features:
              - type: button
          - type: tile
            entity: script.astro_start_s30_deepsky
            name: Deep-Sky starten
            icon: mdi:play-circle
            tap_action:
              action: perform-action
              perform_action: script.astro_start_s30_deepsky
              confirmation:
                text: S30 Pro jetzt starten (Deep-Sky)?
            features:
              - type: button
          # Kein „Drücken“-Knopf: Kachel-Funktionen kennen (noch) keine Rückfrage
          - type: tile
            entity: script.astro_stopp_s30
            name: Stoppen
            icon: mdi:stop-circle
            color: red
            tap_action:
              action: perform-action
              perform_action: script.astro_stopp_s30
              confirmation:
                text: "S30 Pro: Aufnahme jetzt stoppen?"
          # Kein „Drücken“-Knopf: Kachel-Funktionen kennen (noch) keine Rückfrage
          - type: tile
            entity: script.astro_parken_s30
            name: Parken
            icon: mdi:home-import-outline
            color: red
            tap_action:
              action: perform-action
              perform_action: script.astro_parken_s30
              confirmation:
                text: "S30 Pro: Aufnahme stoppen und parken?"
        column_span: 2
