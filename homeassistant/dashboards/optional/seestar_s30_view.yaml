# Optionaler Tab für das Dashboard „Sternwarte“ (Variante 2, sternwarte_v2.yaml): Seestar S30 Pro
#
# Erst einfügen, wenn das zweite Seestar in Home Assistant angelegt ist (Präfix prüfen) – sonst meldet z. B. Spook
# unbekannte Entities. Einfügen: Raw-Konfigurationseditor → unter `views:` hinter den S50-Tab (Einrückung so lassen).
# Auf „Heute Nacht“ im Abschnitt „Geräte“ zusätzlich eine Kachel ergänzen:
#   - type: tile
#     entity: binary_sensor.seestar_s30_connected
#     name: Seestar S30 Pro
#     icon: mdi:telescope
#     tap_action: {action: navigate, navigation_path: /sternwarte/s30}
  - title: S30 Pro
    path: s30
    icon: mdi:telescope
    type: sections
    max_columns: 3
    sections:
    - type: grid
      cards:
      - type: heading
        heading: Seestar S30 Pro
        icon: mdi:telescope
        heading_style: subtitle
        badges:
        - type: entity
          entity: binary_sensor.seestar_s30_connected
          show_state: true
          show_icon: true
          color: state
        - type: entity
          entity: sensor.seestar_s30_battery
          show_state: true
          show_icon: true
          color: state
        - type: entity
          entity: sensor.seestar_s30_storage_used
          show_state: true
          show_icon: true
        - type: entity
          entity: sensor.seestar_s30_sensor_temperature
          show_state: true
          show_icon: true
      - type: tile
        visibility:
        - condition: state
          entity: binary_sensor.seestar_s30_connected
          state_not: 'on'
        entity: binary_sensor.seestar_s30_connected
        name: Nicht verbunden – Station-Modus und WLAN prüfen
        vertical: false
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
      - type: tile
        entity: sensor.seestar_s30_last_alert
        name: Letzte Warnung
        icon: mdi:alert-circle
        color: amber
        visibility:
        - condition: state
          entity: sensor.seestar_s30_last_alert
          state_not: unknown
        - condition: state
          entity: sensor.seestar_s30_last_alert
          state_not: unavailable
      - type: tile
        entity: binary_sensor.seestar_s30_telephoto_lp_filter
        name: LP-Filter
        visibility:
        - condition: state
          entity: sensor.seestar_s30_stack_state
          state:
          - working
          - start
      - type: picture-entity
        entity: camera.seestar_s30_live_stacked_preview
        camera_view: auto
        show_name: false
        show_state: false
        visibility:
        - condition: state
          entity: binary_sensor.seestar_s30_connected
          state: 'on'
        grid_options:
          columns: full
    - type: grid
      cards:
      - type: heading
        heading: Session
        icon: mdi:layers
        heading_style: subtitle
        visibility:
        - condition: state
          entity: sensor.seestar_s30_stack_state
          state:
          - working
          - start
      - type: tile
        entity: sensor.seestar_s30_telephoto_target
        name: Ziel
        icon: mdi:image-filter-center-focus
        visibility:
        - condition: state
          entity: sensor.seestar_s30_stack_state
          state:
          - working
          - start
      - type: tile
        entity: sensor.seestar_s30_integration_time
        name: Belichtung gesamt
        visibility:
        - condition: state
          entity: sensor.seestar_s30_stack_state
          state:
          - working
          - start
      - type: tile
        entity: sensor.seestar_s30_stacked_frames
        name: Gestackt
        visibility:
        - condition: state
          entity: sensor.seestar_s30_stack_state
          state:
          - working
          - start
      - type: tile
        entity: sensor.seestar_s30_dropped_frames
        name: Verworfen
        visibility:
        - condition: state
          entity: sensor.seestar_s30_stack_state
          state:
          - working
          - start
      - type: tile
        entity: sensor.seestar_s30_stars_detected
        name: Sterne erkannt
        visibility:
        - condition: state
          entity: sensor.seestar_s30_stack_state
          state:
          - working
          - start
        features_position: bottom
    - type: grid
      cards:
      - type: heading
        heading: Steuerung
        icon: mdi:gamepad-variant
        heading_style: subtitle
      - type: tile
        entity: switch.seestar_s30_controls_enabled
        name: Steuerung freigegeben
        features_position: inline
        features:
        - type: toggle
      - type: tile
        grid_options:
          columns: 12
          rows: 2
        entity: input_select.astro_ziel_s30
        name: Ziel
        icon: mdi:target
        hide_state: true
        vertical: false
        features:
        - type: select-options
        features_position: bottom
      - type: tile
        entity: script.astro_start_s30_milchstrasse
        name: Milchstraße starten
        icon: mdi:star-shooting
        vertical: false
        tap_action:
          action: perform-action
          perform_action: script.astro_start_s30_milchstrasse
          confirmation:
            text: S30 Pro jetzt starten (Milchstraße)?
        features:
        - type: button
        features_position: inline
      - type: tile
        entity: script.astro_start_s30_deepsky
        name: Deep-Sky starten
        icon: mdi:play-circle
        vertical: false
        tap_action:
          action: perform-action
          perform_action: script.astro_start_s30_deepsky
          confirmation:
            text: S30 Pro jetzt starten (Deep-Sky)?
        features:
        - type: button
        features_position: inline
      - type: tile
        entity: switch.seestar_s30_dew_heater
        name: Tauheizung
        vertical: false
        features:
        - type: toggle
        features_position: bottom
      - type: tile
        entity: script.astro_goto_s30
        name: GoTo starten
        icon: mdi:crosshairs-gps
        tap_action:
          action: perform-action
          perform_action: script.astro_goto_s30
        features:
        - type: button
      - type: tile
        entity: script.astro_stopp_s30
        name: Stoppen
        icon: mdi:stop-circle
        color: red
        tap_action:
          action: perform-action
          perform_action: script.astro_stopp_s30
          confirmation:
            text: 'S30 Pro: Aufnahme jetzt stoppen?'
        features:
        - type: button
      - type: tile
        entity: script.astro_parken_s30
        name: Parken
        icon: mdi:home-import-outline
        color: red
        tap_action:
          action: perform-action
          perform_action: script.astro_parken_s30
          confirmation:
            text: 'S30 Pro: Aufnahme stoppen und parken?'
        features:
        - type: button
    - type: grid
      cards:
      - type: heading
        heading: Montierung
        icon: mdi:axis-arrow
        heading_style: subtitle
        badges:
        - type: entity
          show_state: true
          show_icon: true
          entity: sensor.seestar_s30_azimuth
        - type: entity
          show_state: true
          show_icon: true
          entity: sensor.seestar_s30_altitude
      - type: tile
        entity: sensor.seestar_s30_goto_state
        name: GoTo
      - type: tile
        entity: binary_sensor.seestar_s30_parked
        name: Geparkt
      - type: tile
        entity: binary_sensor.seestar_s30_tracking
        name: Nachführung
      - type: tile
        entity: binary_sensor.seestar_s30_slewing
        name: Fährt
    - type: grid
      cards:
      - type: heading
        heading: Gerät
        icon: mdi:battery-heart-variant
        heading_style: subtitle
      - type: tile
        entity: sensor.seestar_s30_charger
        name: Ladegerät
        icon: mdi:power-plug
      - type: tile
        entity: binary_sensor.seestar_s30_dew_heater
        name: Tauheizung (Gerät)
      - type: tile
        entity: sensor.seestar_s30_firmware
        name: Firmware
