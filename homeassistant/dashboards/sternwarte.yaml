# Lovelace-Dashboard „Sternwarte“
#
# Einrichten: Einstellungen → Dashboards → Dashboard hinzufügen → „Neues Dashboard von Grund auf“,
# dann ⋮ → Bearbeiten → ⋮ → Raw-Konfigurationseditor → diesen Inhalt einfügen.
#
# Voraussetzungen: Packages astro_audit.yaml und astro_stacks.yaml, HA-Add-on ha-seestar, seestar-lovelace-card (HACS),
# siril-auto mit MQTT_ENABLED=1.
# Anpassen (Suchen/Ersetzen):
#   seestar_s50                 → Entity-Präfix deines Seestar
#   http://astro.lan            → Adresse der Astro-Galerie
#   sensor.gw2000a_*            → Ecowitt-Entities
#   http://astro-pi.lan:8080    → Web-App des Astro-Pi (Abschnitt blendet sich aus, solange der Pi fehlt)
#
# Bedienung: Starten nur per Knopf mit Rückfrage – automatisch passiert nur das Schutz-Parken in der Nacht.
title: Sternwarte
views:
  - title: Sternwarte
    path: sternwarte
    icon: mdi:telescope
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heute Nacht
            icon: mdi:weather-night
            heading_style: subtitle
          - type: markdown
            content: >-
              ## {{ states('input_text.astro_empfehlung') }}

              {% set s = states('input_datetime.astro_fenster_start') %} {% set
              e = states('input_datetime.astro_fenster_ende') %} {% if s not in
              ['unknown', 'unavailable'] %} Beobachtungsfenster **{{
              as_timestamp(s) | timestamp_custom('%H:%M') }}–{{ as_timestamp(e)
              | timestamp_custom('%H:%M') }} Uhr** · Modus: {{
              states('input_select.astro_modus') }} {% endif %}

              {% if is_state('input_select.astro_modus', 'weitfeld') %}🌌
              **Milchstraßen-Nacht** – Weitwinkel mit EOS 6D oder S30 Pro lohnt
              sich.{% endif %}
          - type: tile
            entity: input_select.astro_stufe
            name: Stufe
            icon: mdi:star-four-points
          - type: tile
            entity: input_boolean.astro_nacht_lohnt
            name: Lohnt sich
          - type: tile
            entity: input_boolean.astro_automatik
            name: Automatik
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: input_boolean.astro_schutz_parken
            name: Schutz-Parken
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: script.astro_session_starten
            name: Session starten
            icon: mdi:play-circle
            tap_action:
              action: perform-action
              perform_action: script.astro_session_starten
              confirmation:
                text: Session jetzt starten?
          - type: tile
            entity: script.astro_audit
            name: Audit jetzt
            icon: mdi:robot
            tap_action:
              action: perform-action
              perform_action: script.astro_audit
              confirmation:
                text: KI-Audit jetzt ausführen?
          - type: heading
            heading: Bedingungen
            icon: mdi:weather-partly-cloudy
            heading_style: subtitle
          - type: tile
            entity: sensor.astro_taupunktabstand
            name: Taupunktabstand
            state_content:
              - state
              - quelle
          - type: tile
            entity: sensor.gw2000a_outdoor_temperature
            name: Temperatur (Garten)
          - type: tile
            entity: sensor.gw2000a_humidity
            name: Luftfeuchte
          - type: tile
            entity: sensor.gw2000a_rain_rate
            name: Regenrate
          - type: tile
            entity: sensor.astroweather_backyard_deepsky_forecast_today
            name: Deep-Sky heute
          - type: tile
            entity: sensor.astroweather_backyard_seeing
            name: Seeing
          - type: tile
            entity: sensor.astroweather_backyard_transparency
            name: Transparenz
          - type: tile
            entity: sensor.astroweather_backyard_cloud_cover
            name: Wolken
          - type: weather-forecast
            entity: weather.renningen_2
            forecast_type: hourly
            show_current: false
      - type: grid
        cards:
          - type: heading
            heading: Seestar
            icon: mdi:telescope
            heading_style: subtitle
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.seestar_s50_storage_used
                color: state
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.seestar_s50_battery
                color: state
          - type: custom:seestar-card
            device: seestar_s50
            visibility:
              - condition: state
                entity: binary_sensor.seestar_s50_connected
                state: 'on'
            grid_options:
              columns: full
          - type: markdown
            content: >-
              <ha-alert alert-type="warning">Das Seestar ist nicht verbunden.
              Station-Modus und WLAN prüfen.</ha-alert>
            visibility:
              - condition: state
                entity: binary_sensor.seestar_s50_connected
                state_not: 'on'
            text_only: true
            grid_options:
              columns: full
          - type: tile
            entity: switch.seestar_s50_controls_enabled
            name: Steuerung freigegeben
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: switch.seestar_s50_dew_heater
            name: Tauheizung
            features_position: inline
            features:
              - type: toggle
        column_span: 2
      - type: grid
        cards:
          - type: heading
            heading: Nachverarbeitung
            icon: mdi:image-filter-hdr
            heading_style: subtitle
          - type: tile
            entity: sensor.siril_auto_stacking_status
            name: Siril
            state_content:
              - state
              - target
          - type: markdown
            content: >-
              {% set e = 'sensor.siril_auto_stacking_letztes_ergebnis' %} {% if
              states(e) not in ['unknown', 'unavailable'] %} **Zuletzt
              gestackt:** {{ state_attr(e, 'target') }} ({{ 'Master' if
              state_attr(e, 'stack') == 'master' else 'Nacht ' ~ state_attr(e,
              'night') }}, {{ state_attr(e, 'filter') }}) · {{ state_attr(e,
              'frames') }} Frames · {{ as_timestamp(state_attr(e, 'timestamp'))
              | timestamp_custom('%d.%m. %H:%M') }}{% if state_attr(e,
              'device_label') %} · {{ state_attr(e, 'device_label') }}{% endif
              %}

              {% if state_attr(e, 'id') %}<a href="http://astro.lan/#{{
              state_attr(e, 'group') }}"><img src="http://astro.lan/img/{{
              state_attr(e, 'id') }}_t.jpg" width="100%"></a>{% endif %} {% else
              %} <ha-alert alert-type="error">Noch kein Stack.</ha-alert> {%
              endif %}
            text_only: true
          - type: markdown
            visibility:
              - condition: numeric_state
                entity: sensor.astro_stacks_dieser_nacht
                above: 0
            content: >-
              **Diese Nacht:** {% for s in
              state_attr('sensor.astro_stacks_dieser_nacht', 'stacks') or [] %}
              [{{ s.target }} {{ s.filter }} · {{ 'Master' if s.stack ==
              'master' else s.frames ~ ' Frames' }}](http://astro.lan/#{{
              s.group }}){{ ',' if not loop.last }} {%- endfor %}
          - type: tile
            entity: input_boolean.astro_push_pro_stack
            name: Push je Stack
          - type: button
            name: Astro-Galerie öffnen
            icon: mdi:image-multiple
            tap_action:
              action: url
              url_path: http://astro.lan
      - type: grid
        visibility:
          - condition: state
            entity: sensor.astro_pi_montierung
            state_not: unavailable
        cards:
          - type: heading
            heading: Astro-Pi
            icon: mdi:raspberry-pi
            heading_style: subtitle
          - type: tile
            entity: sensor.astro_pi_montierung
            name: Montierung
          - type: tile
            entity: sensor.astro_pi_ziel
            name: Ziel
          - type: tile
            entity: sensor.astro_pi_serie
            name: Serie
          - type: tile
            entity: sensor.astro_pi_hfr
            name: HFR
          - type: tile
            entity: sensor.astro_pi_speicher_frei
            name: Speicher frei
          - type: picture-entity
            entity: image.astro_pi_letzte_aufnahme
            name: Letzte Aufnahme
            show_state: false
            grid_options:
              columns: full
          - type: button
            name: Astro-Pi-App öffnen
            icon: mdi:tablet
            tap_action:
              action: url
              url_path: http://astro-pi.lan:8080
